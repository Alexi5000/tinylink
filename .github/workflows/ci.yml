name: Check TinyLink
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
